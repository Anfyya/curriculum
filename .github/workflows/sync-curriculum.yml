name: Sync Curriculum ICS

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 0-4"  # 北京时间工作日 07:30
    - cron: "0 5 * * 1-5"    # 北京时间工作日 13:00
    - cron: "0 10 * * 1-5"   # 北京时间工作日 18:00
    - cron: "0 15 * * 1-5"   # 北京时间工作日 23:00

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ddddocr playwright
          playwright install chromium --with-deps

      - name: Build ICS
        env:
          SSO_USERNAME: ${{ secrets.SSO_USERNAME }}
          SSO_PASSWORD: ${{ secrets.SSO_PASSWORD }}
          CURRICULUM_OUTPUT: curriculum.ics
          CURRICULUM_CALENDAR_NAME: 课程表
        run: |
          python sync_curriculum_ics.py

      - name: Commit and Push
        run: |
          git add curriculum.ics
          if git diff --cached --quiet -- curriculum.ics; then
            echo "curriculum.ics 无变化"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "自动同步课程表 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
